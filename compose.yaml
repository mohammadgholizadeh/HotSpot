services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hotspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotspot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hotspot
      RABBITMQ_DEFAULT_PASS: 1234
    ports:
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hotspot-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotspot:local
    command: ["hotspot", "serve"]
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /app/configs/docker.yaml
    volumes:
      - ./configs/docker.yaml:/app/configs/docker.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  hotspot-worker:
    image: hotspot:local
    command: ["hotspot", "worker"]
    environment:
      CONFIG_PATH: /app/configs/docker.yaml
    volumes:
      - ./configs/docker.yaml:/app/configs/docker.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
